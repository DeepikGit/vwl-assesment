version: '3.8'

services:
  app:
    image: deepikdc/vwl_repo:shoplist-app
    ports:
      - "80:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=devdb
      - JWT_SECRET=your-secret
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

